name: Validate HACS integration
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m compileall -q custom_components/mittelhof_inventory
      - run: node --check custom_components/mittelhof_inventory/frontend/mittelhof-inventory-card.js
      - run: node --check custom_components/mittelhof_inventory/frontend/vendor/qrgen.js
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_qr.cjs
      - run: node tests/test_ios_http.cjs
      - run: node tests/test_dashboard_cards.cjs
      - run: node tests/test_overview_groups.cjs
      - run: python -c "import json,pathlib;json.loads(pathlib.Path('hacs.json').read_text());json.loads(pathlib.Path('custom_components/mittelhof_inventory/manifest.json').read_text())"
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  release_v102:
    name: Publish v1.0.2 after successful validation
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [syntax, hacs, hassfest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release v1.0.2 if missing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c 'import json; print(json.load(open("custom_components/mittelhof_inventory/manifest.json"))["version"])')
          if [[ "$version" != "1.0.2" ]]; then
            echo "Manifest version changed; this release job is scoped to v1.0.2."
            exit 0
          fi
          if gh release view v1.0.2 >/dev/null 2>&1; then
            echo "Release v1.0.2 already exists."
            exit 0
          fi
          cat > /tmp/inventory-release-notes.md <<'EOF'
          Mittelhof Inventar v1.0.2 (Home Assistant / HACS)
          
          - Show stock per chosen location, inventory area and related articles.
          - Allow multi-site selection while excluding unrelated or inactive areas.
          - Replace typed deletion confirmation phrases with clear confirmation dialogs.
          - Use concise Inventory KPI labels in the private dashboard without changing entity IDs.
          - Add selected-site and grouped-inventory frontend regression tests.

          Existing inventory data is preserved. Back up Home Assistant before upgrading.
          EOF
          gh release create v1.0.2 --target "$GITHUB_SHA" --title "v1.0.2" --notes-file /tmp/inventory-release-notes.md

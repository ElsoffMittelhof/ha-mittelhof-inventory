name: Validate HACS integration
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m compileall -q custom_components/mittelhof_inventory
      - run: node --check custom_components/mittelhof_inventory/frontend/mittelhof-inventory-card.js
      - run: node --check custom_components/mittelhof_inventory/frontend/vendor/qrgen.js
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_qr.cjs
      - run: node tests/test_frontend_v2.cjs
      - run: node tests/test_frontend_comparison.cjs
      - run: node tests/test_responsive_sorting.cjs
      - run: python -c "import json,pathlib;json.loads(pathlib.Path('hacs.json').read_text());json.loads(pathlib.Path('custom_components/mittelhof_inventory/manifest.json').read_text())"
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  release_v211:
    name: Publish v2.1.1 after successful validation
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [syntax, hacs, hassfest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release v2.1.1 if missing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c 'import json; print(json.load(open("custom_components/mittelhof_inventory/manifest.json"))["version"])')
          if [[ "$version" != "2.1.1" ]]; then
            echo "Manifest version changed; this release job is scoped to v2.1.1."
            exit 0
          fi
          if gh release view v2.1.1 >/dev/null 2>&1; then
            echo "Release v2.1.1 already exists."
            exit 0
          fi
          cat > /tmp/inventory-release-notes.md <<'EOF'
          Mittelhof Inventar v2.1.1 (Home Assistant / HACS)
          
          - Widen every inventory dashboard view on laptops via Home Assistant
            full-width panel layout and responsive custom cards (max 1480px).
          - Keep the familiar single-column mobile display.
          - Alphabetize all dropdown options and checkbox labels using German
            locale-aware, natural-number sorting; retain selected values.
          - Keep existing physical-area inventory, QR codes and comparison logic.
          - Update the entire four-view private inventar.yaml separately.
          EOF
          gh release create v2.1.1 --target "$GITHUB_SHA" --title "v2.1.1" --notes-file /tmp/inventory-release-notes.md

name: Validate HACS integration
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m compileall -q custom_components/mittelhof_inventory
      - run: node --check custom_components/mittelhof_inventory/frontend/mittelhof-inventory-card.js
      - run: node --check custom_components/mittelhof_inventory/frontend/vendor/qrgen.js
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_qr.cjs
      - run: node tests/test_ios_http.cjs
      - run: python -c "import json,pathlib;json.loads(pathlib.Path('hacs.json').read_text());json.loads(pathlib.Path('custom_components/mittelhof_inventory/manifest.json').read_text())"
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  release_v100:
    name: Publish v1.0.0 after successful validation
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [syntax, hacs, hassfest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release v1.0.0 if missing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c 'import json; print(json.load(open("custom_components/mittelhof_inventory/manifest.json"))["version"])')
          if [[ "$version" != "1.0.0" ]]; then
            echo "Manifest version changed; this release job is scoped to v1.0.0."
            exit 0
          fi
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "Release v1.0.0 already exists."
            exit 0
          fi
          cat > /tmp/inventory-release-notes.md <<'EOF'
          Mittelhof Inventar v1.0.0 (Home Assistant / HACS)
          
          - Add user-managed article categories, with safe rename and delete.
          - Add physical inventory areas, such as cutlery drawers, with one QR label per area.
          - Capture entire areas as one atomic, optimistic-locked, idempotent multi-item stocktake.
          - Permit safe deletion of any empty site, including Lager, while preserving audit history.
          - Keep existing items, SKUs, manufacturer/model metadata, site stock and all bookings.
          - Extend HA sensors and dashboard cards for area/category lists.
          - Retain reliable admin-only WebSocket save receipts from v0.9.1.

          Existing inventory data is preserved. Back up Home Assistant before upgrading.
          EOF
          gh release create v1.0.0 --target "$GITHUB_SHA" --title "v1.0.0" --notes-file /tmp/inventory-release-notes.md

book_transaction:
  name: Inventarbuchung
  description: Bucht eine Bestandsbewegung im lokalen Home-Assistant-Inventar.
  fields:
    kind:
      name: Buchungsart
      required: true
      selector:
        select:
          options: [receipt, consume, transfer, adjustment_in, adjustment_out]
    item_id:
      name: Artikel-ID
      required: true
      selector: {text: {}}
    from_location_id:
      name: Quellstandort-ID
      selector: {text: {}}
    to_location_id:
      name: Zielstandort-ID
      selector: {text: {}}
    quantity:
      name: Anzahl
      required: true
      selector: {number: {min: 1, max: 1000000, mode: box}}
    note:
      name: Kommentar
      selector: {text: {}}
    idempotency_key:
      name: Idempotenzschlüssel
      description: Bei Automationen stabil pro Vorgang setzen.
      selector: {text: {}}
create_item:
  name: Artikel anlegen
  description: Legt einen Artikel an und vergibt die eindeutige Artikelnummer automatisch.
  fields:
    location_ids:
      name: Zuordnung zu Standorten (IDs)
      selector: {object: {}}
    category:
      name: Artikelkategorie
      selector: {text: {}}
    manufacturer:
      name: Hersteller (optional)
      selector: {text: {}}
    product_name:
      name: Genaue Produktbezeichnung / Modell (optional)
      selector: {text: {}}
    name:
      name: Artikelname
      required: true
      selector: {text: {}}
    unit:
      name: Einheit
      selector: {text: {}}
create_location:
  name: Standort anlegen
  description: Legt einen Lagerort an.
  fields:
    code:
      name: Kürzel
      required: true
      selector: {text: {}}
    name:
      name: Standortname
      required: true
      selector: {text: {}}
set_stock_policy:
  name: Mindest- und Sollbestand
  description: Konfiguriert Nachbestellvorschläge je Artikel und Standort.
  fields:
    item_id:
      name: Artikel-ID
      required: true
      selector: {text: {}}
    location_id:
      name: Standort-ID
      required: true
      selector: {text: {}}
    min_quantity:
      name: Mindestmenge
      required: true
      selector: {number: {min: 0, max: 1000000, mode: box}}
    target_quantity:
      name: Sollmenge
      required: true
      selector: {number: {min: 0, max: 1000000, mode: box}}
    reorder_multiple:
      name: Bestellvielfaches
      selector: {number: {min: 1, max: 1000000, mode: box}}
set_count:
  name: Inventur-Istbestand setzen
  description: Setzt nach Bestätigung eine gezählte absolute Menge an einem Standort (nur Administratoren).
  fields:
    item_id:
      required: true
      selector: {text: {}}
    location_id:
      required: true
      selector: {text: {}}
    quantity:
      name: Gezählt
      required: true
      selector: {number: {min: 0, max: 1000000, mode: box}}
    expected_quantity:
      name: Bisheriger Buchungsbestand
      required: true
      selector: {number: {min: 0, max: 1000000, mode: box}}
    idempotency_key:
      selector: {text: {}}
    note:
      selector: {text: {}}
delete_item:
  name: Artikel unwiderruflich löschen
  description: Löscht Artikel, dessen Bestände, Regeln und Buchungshistorie (nur Administratoren).
  fields:
    item_id:
      required: true
      selector: {text: {}}
    confirmation:
      name: Bestätigung DELETE:<Artikelnummer>
      required: true
      selector: {text: {}}
reset_stock:
  name: Gesamten Buchungsbestand löschen
  description: Löscht alle Bestandspositionen, Zählmarkierungen und Transaktionen. Artikel und Standorte bleiben erhalten (nur Administratoren).
  fields:
    confirmation:
      name: Bestätigung BESTAND LOESCHEN
      required: true
      selector: {text: {}}

set_item_locations:
  name: Artikelstandorte zuordnen
  description: Setzt die aktiven Standorte eines Artikels atomar. Standorte mit vorhandenem Bestand können nicht entfernt werden.
  fields:
    item_id:
      required: true
      selector: {text: {}}
    location_ids:
      required: true
      selector: {object: {}}
set_item_location:
  name: Einzelnen Artikelstandort zuordnen
  fields:
    item_id:
      required: true
      selector: {text: {}}
    location_id:
      required: true
      selector: {text: {}}
    assigned:
      required: true
      selector: {boolean: {}}

update_item:
  name: Artikeldetails aktualisieren
  description: Ändert den Artikelnamen, die Einheit, den Hersteller und die Produktbezeichnung, nicht die automatisch vergebene Artikelnummer.
  fields:
    item_id:
      required: true
      selector: {text: {}}
    name:
      required: true
      selector: {text: {}}
    unit:
      selector: {text: {}}
    manufacturer:
      selector: {text: {}}
    product_name:
      selector: {text: {}}
